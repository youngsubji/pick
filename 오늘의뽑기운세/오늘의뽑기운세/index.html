<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>오늘의뽑기운세</title>
<meta name="description" content="카드 한 장을 골라 오늘의 맞춤 운세를 확인해 보세요." />
<meta name="theme-color" content="#191033" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app" id="app">

  <!-- ===================== 헤더 ===================== -->
  <header class="header">
    <p class="eyebrow">TODAY'S FORTUNE DRAW</p>
    <h1 class="title">오늘의뽑기운세</h1>
    <p class="subtitle" id="subtitle">마음이 가는 카드 한 장을 선택해 보세요</p>
  </header>

  <!-- ===================== 메인 ===================== -->
  <main class="main">

    <!-- ---------- 1. 뽑기 화면 ---------- -->
    <section class="screen screen-draw" id="screen-draw">

      <!-- 맞춤 정보 입력 (선택) -->
      <div class="personalize" id="personalize">
        <button type="button" class="personalize-toggle" id="personalizeToggle" aria-expanded="false" aria-controls="personalizeForm">
          <span class="personalize-toggle-icon" aria-hidden="true">✦</span>
          <span>맞춤 정보 입력하기 <em>(선택)</em></span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>

        <div class="personalize-form" id="personalizeForm" hidden>

          <div class="field">
            <label for="inputName">이름 또는 닉네임</label>
            <input type="text" id="inputName" maxlength="10" placeholder="예: 민지" autocomplete="off" />
          </div>

          <div class="field">
            <label for="inputAge">연령대</label>
            <select id="inputAge">
              <option value="">선택 안 함</option>
              <option value="10대">10대</option>
              <option value="20대">20대</option>
              <option value="30대">30대</option>
              <option value="40대">40대</option>
              <option value="50대 이상">50대 이상</option>
            </select>
          </div>

          <div class="field">
            <span class="field-label">오늘 가장 궁금한 분야</span>
            <div class="chip-group" role="group" aria-label="오늘 가장 궁금한 분야" id="topicGroup">
              <button type="button" class="chip" data-group="topic" data-value="종합운">종합운</button>
              <button type="button" class="chip" data-group="topic" data-value="직장·학업운">직장·학업운</button>
              <button type="button" class="chip" data-group="topic" data-value="금전운">금전운</button>
              <button type="button" class="chip" data-group="topic" data-value="연애·인간관계운">연애·인간관계운</button>
              <button type="button" class="chip" data-group="topic" data-value="건강운">건강운</button>
            </div>
          </div>

          <div class="field">
            <span class="field-label">현재 기분</span>
            <div class="chip-group" role="group" aria-label="현재 기분" id="moodGroup">
              <button type="button" class="chip" data-group="mood" data-value="기분이 좋음">기분이 좋음</button>
              <button type="button" class="chip" data-group="mood" data-value="평범함">평범함</button>
              <button type="button" class="chip" data-group="mood" data-value="조금 피곤함">조금 피곤함</button>
              <button type="button" class="chip" data-group="mood" data-value="고민이 있음">고민이 있음</button>
              <button type="button" class="chip" data-group="mood" data-value="새로운 변화가 필요함">새로운 변화가 필요함</button>
            </div>
          </div>

          <div class="field">
            <label for="inputSchedule">오늘의 중요 일정</label>
            <input type="text" id="inputSchedule" maxlength="40" placeholder="예: 중요한 회의가 있어요" autocomplete="off" />
          </div>

          <p class="privacy-note">입력한 정보는 저장되지 않으며, 이 화면에서만 사용돼요.</p>
        </div>
      </div>

      <!-- 카드 5장 -->
      <div class="cards" id="cards" role="group" aria-label="운세 카드 5장 중 하나를 선택하세요"></div>

      <p class="hint" id="drawHint">카드는 한 장만 선택할 수 있어요.</p>
    </section>

    <!-- ---------- 2. 결과 화면 ---------- -->
    <section class="screen screen-result" id="screen-result" hidden>
      <div class="result-card" id="resultCard">

        <p class="result-lead" id="resultLead"></p>

        <div class="grade-badge" id="gradeBadge">
          <span class="grade-label">오늘의 운세</span>
          <span class="grade-value" id="gradeValue">대길</span>
        </div>

        <div class="result-sections" id="resultSections"></div>

        <div class="result-block action-block">
          <h2 class="block-title">오늘의 행동 조언</h2>
          <p class="block-body" id="actionAdvice"></p>
        </div>

        <div class="lucky-row">
          <div class="lucky-item">
            <span class="lucky-label">행운의 색</span>
            <span class="lucky-value" id="luckyColor">-</span>
          </div>
          <div class="lucky-item">
            <span class="lucky-label">행운의 숫자</span>
            <span class="lucky-value" id="luckyNumber">-</span>
          </div>
        </div>
      </div>

      <button type="button" class="redraw-btn" id="redrawBtn">다시 뽑기</button>
    </section>

  </main>

  <footer class="footer">
    <p>본 운세는 재미와 가벼운 참고를 위한 콘텐츠입니다. 오늘의 선택과 행동이 가장 좋은 운을 만듭니다.</p>
  </footer>

</div>

<script src="script.js"></script>
<script>
  // 서비스 워커 등록 (PWA/APK 설치 조건 충족을 위함)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        /* 서비스 워커 등록 실패 시에도 앱은 정상 동작합니다 */
      });
    });
  }
</script>
</body>
</html>
